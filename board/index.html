  }
  async function tryCode(code, fromHash, type) {
    var e = document.getElementById('e'), box = document.getElementById('box');

  }
  document.getElementById('f').addEventListener('submit', function (ev) { ev.preventDefault(); tryCode(document.getElementById('c').value.trim(), false); });
  var h = location.hash.replace(/^#/, ''); var m = /^(?:([kt])=)?(.+)$/.exec(h);
